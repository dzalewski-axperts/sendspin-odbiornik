<!doctype html>
<!--
  Odbiornik Sendspin dla Nest Huba w salonie, wersja z wyglądem dla domu.
  Na podstawie https://github.com/Sendspin/cast (Apache License 2.0, plik LICENSE obok).
  Zmieniony tylko wygląd (HTML i CSS); skrypt assets/receiver-BTJozp6n.js bez zmian,
  woła window.setNowPlaying, setProgress, setVolume, setPlaybackState, setStatus, setDebug, showError.
-->
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom: muzyka</title>
    <style>
      :root {
        --akcent: 255, 255, 255;
        --tekst: rgba(255, 255, 255, 0.96);
        --tekst-2: rgba(255, 255, 255, 0.72);
        --tekst-3: rgba(255, 255, 255, 0.5);
        --pasek-tlo: rgba(255, 255, 255, 0.18);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--tekst);
        background: #0b0d1a;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Tło: rozmyta okładka z powolnym ruchem, a bez okładki zorza */
      .tlo { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
      .zorza {
        position: absolute; inset: -20%;
        background:
          radial-gradient(40% 50% at 20% 30%, rgba(91, 70, 220, 0.55), transparent 70%),
          radial-gradient(45% 55% at 80% 70%, rgba(0, 170, 190, 0.45), transparent 70%),
          radial-gradient(35% 45% at 60% 20%, rgba(220, 70, 140, 0.35), transparent 70%),
          #0b0d1a;
        animation: dryf 38s ease-in-out infinite alternate;
      }
      .ruch {
        position: absolute; inset: -15%;
        animation: dryf 46s ease-in-out infinite alternate;
      }
      .warstwa {
        position: absolute; inset: 0; width: 100%; height: 100%;
        opacity: 0;
        transition: opacity 1.8s ease;
      }
      .warstwa.widoczna { opacity: 1; }
      .winieta {
        position: absolute; inset: 0;
        background:
          radial-gradient(120% 90% at 30% 50%, transparent 45%, rgba(0, 0, 0, 0.4) 100%),
          linear-gradient(90deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.3) 55%, rgba(0, 0, 0, 0.35));
      }
      @keyframes dryf {
        0% { transform: scale(1.08) translate(0, 0) rotate(0deg); }
        50% { transform: scale(1.16) translate(-2.5%, 1.5%) rotate(2deg); }
        100% { transform: scale(1.1) translate(2%, -2%) rotate(-1.5deg); }
      }

      /* Całość przesuwa się co minutę o kilka pikseli, żeby ekran się nie wypalał */
      .scena {
        position: relative; z-index: 1; height: 100vh;
        padding: 5.5vh 5.5vw;
        transition: transform 3s ease;
      }

      .zegar {
        position: absolute; top: 4.5vh; right: 5.5vw; text-align: right;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      }
      .zegar .godzina { font-size: 30px; font-weight: 500; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
      .zegar .data { font-size: 15px; color: var(--tekst-2); margin-top: 2px; }

      /* Odtwarzanie */
      .gra {
        height: 100%;
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 5vw;
        transition: opacity 0.8s ease;
      }
      .okladka-ramka { position: relative; height: min(68vh, 40vw); aspect-ratio: 1; }
      .okladka {
        width: 100%; height: 100%; object-fit: cover; display: block;
        border-radius: 22px;
        box-shadow:
          0 30px 60px -12px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 80px -10px rgba(var(--akcent), 0.45);
        transition: transform 0.8s ease, filter 0.8s ease, box-shadow 1.5s ease;
      }
      .okladka-pusta {
        width: 100%; height: 100%; border-radius: 22px;
        display: none; align-items: center; justify-content: center;
        background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.1);
      }
      .okladka-pusta svg { width: 38%; height: 38%; fill: rgba(255,255,255,0.55); }
      body.pauza .okladka { transform: scale(0.96); filter: saturate(0.6) brightness(0.8); }

      .info { min-width: 0; padding-top: 3vh; }
      .naglowek {
        display: flex; align-items: center; gap: 12px;
        font-size: 14px; letter-spacing: 2.5px; text-transform: uppercase;
        color: var(--tekst-2); margin-bottom: 18px;
      }
      .rowno { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
      .rowno span {
        width: 4px; height: 100%; border-radius: 2px;
        background: rgba(var(--akcent), 0.95);
        transform-origin: bottom;
        animation: skok 1.1s ease-in-out infinite;
      }
      .rowno span:nth-child(2) { animation-duration: 0.8s; animation-delay: -0.3s; }
      .rowno span:nth-child(3) { animation-duration: 1.3s; animation-delay: -0.6s; }
      .rowno span:nth-child(4) { animation-duration: 0.95s; animation-delay: -0.2s; }
      body.pauza .rowno span { animation-play-state: paused; transform: scaleY(0.25); }
      @keyframes skok { 0%, 100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }

      .tytul {
        font-size: clamp(34px, 5.4vw, 64px); font-weight: 700; line-height: 1.05;
        letter-spacing: -0.5px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        text-wrap: balance;
      }
      .wykonawca {
        margin-top: 14px; font-size: clamp(18px, 2.4vw, 26px); font-weight: 500; color: var(--tekst);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .album {
        margin-top: 6px; font-size: clamp(15px, 1.8vw, 19px); color: var(--tekst-3);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      .postep { margin-top: 5.5vh; max-width: 560px; }
      .pasek { height: 6px; border-radius: 3px; background: var(--pasek-tlo); overflow: hidden; }
      .pasek-wypelnienie {
        height: 100%; width: 0; border-radius: 3px;
        background: linear-gradient(90deg, rgba(var(--akcent), 0.75), rgba(255, 255, 255, 0.95));
        transition: width 1s linear;
      }
      .czasy {
        display: flex; justify-content: space-between; margin-top: 8px;
        font-size: 14px; color: var(--tekst-3); font-variant-numeric: tabular-nums;
      }
      .glosnosc {
        display: flex; align-items: center; gap: 10px; margin-top: 3vh;
        font-size: 14px; color: var(--tekst-3);
      }
      .glosnosc svg { width: 18px; height: 18px; fill: currentColor; }
      .glosnosc .pasek { width: 120px; height: 4px; }

      /* Bez muzyki ta sama plansza: ostatni utwór w pauzie albo „Cisza” */
      .stan { margin-top: 14px; font-size: 15px; color: var(--tekst-3); letter-spacing: 0.5px; }
      .stan:empty { display: none; }
      body.cisza .glosnosc, body.cisza .postep { display: none !important; }

      /* Błąd: zostaje do diagnostyki, ale w spokojniejszej formie */
      .blad {
        display: none; position: fixed; inset: 0; z-index: 100;
        background: rgba(10, 10, 20, 0.96); padding: 32px; overflow: auto;
        font-size: 13px; color: var(--tekst-2);
      }
      .blad.visible { display: block; }
      .blad h2 { font-size: 20px; color: var(--tekst); margin-bottom: 14px; }
      .blad pre { white-space: pre-wrap; word-break: break-word; font-family: "Roboto Mono", monospace; margin-bottom: 12px; }
      #debug { display: none; }
    </style>
  </head>
  <body class="cisza pauza">
    <div class="tlo">
      <div class="zorza"></div>
      <div class="ruch">
        <canvas class="warstwa" id="tlo-a" width="40" height="24"></canvas>
        <canvas class="warstwa" id="tlo-b" width="40" height="24"></canvas>
      </div>
      <div class="winieta"></div>
    </div>

    <div class="scena" id="scena">
      <div class="zegar"><div class="godzina" data-godzina>--:--</div><div class="data" data-data></div></div>

      <main class="gra" id="gra">
        <div class="okladka-ramka">
          <img class="okladka" id="okladka" alt="" crossorigin="anonymous" style="display: none" />
          <div class="okladka-pusta" id="okladka-pusta" style="display: flex">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" /></svg>
          </div>
        </div>
        <section class="info">
          <div class="naglowek">
            <div class="rowno"><span></span><span></span><span></span><span></span></div>
            <span id="naglowek-tekst">Salon</span>
          </div>
          <h1 class="tytul" id="tytul">Cisza</h1>
          <div class="wykonawca" id="wykonawca">Włącz muzykę w aplikacji Dom</div>
          <div class="album" id="album"></div>
          <div class="postep" id="postep">
            <div class="pasek"><div class="pasek-wypelnienie" id="postep-wypelnienie"></div></div>
            <div class="czasy"><span id="czas-biezacy">0:00</span><span id="czas-calkowity">0:00</span></div>
          </div>
          <div class="stan" id="stan"></div>
          <div class="glosnosc">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" /></svg>
            <div class="pasek"><div class="pasek-wypelnienie" id="glosnosc-wypelnienie"></div></div>
            <span id="glosnosc-procent">-</span>
          </div>
        </section>
      </main>
    </div>

    <div class="blad" id="error-overlay">
      <h2>Coś poszło nie tak</h2>
      <pre id="error-context">-</pre>
      <pre id="error-message">-</pre>
      <pre id="error-stack">-</pre>
      <pre id="error-meta">-</pre>
    </div>
    <div id="debug"></div>

    <script type="module" crossorigin src="./assets/receiver-BTJozp6n.js"></script>
    <script>
      var $ = function (id) { return document.getElementById(id); };
      var body = document.body;

      // Zegar i data po polsku
      var fGodzina = new Intl.DateTimeFormat("pl-PL", { hour: "2-digit", minute: "2-digit" });
      var fData = new Intl.DateTimeFormat("pl-PL", { weekday: "long", day: "numeric", month: "long" });
      function tykaj() {
        var teraz = new Date();
        var g = fGodzina.format(teraz), d = fData.format(teraz);
        document.querySelectorAll("[data-godzina]").forEach(function (e) { e.textContent = g; });
        document.querySelectorAll("[data-data]").forEach(function (e) { e.textContent = d; });
      }
      tykaj();
      setInterval(tykaj, 5000);

      // Ochrona przed wypaleniem: co minutę przesunięcie o kilka pikseli
      setInterval(function () {
        var x = Math.round(Math.random() * 12 - 6), y = Math.round(Math.random() * 10 - 5);
        $("scena").style.transform = "translate(" + x + "px," + y + "px)";
      }, 60000);

      // Tło: okładka zmniejszona do 40x24 i rozciągnięta na ekran daje miękkie rozmycie
      // bez filtra CSS (lekkie dla Nest Huba i działa także dla obrazów z innego serwera).
      var tloAktywne = "a", tloUrl = null;
      function malujTlo(cel, img) {
        var x = cel.getContext("2d");
        x.clearRect(0, 0, cel.width, cel.height);
        try { x.filter = "blur(2px) saturate(1.8) brightness(0.85)"; } catch (e) {}
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        var skala = Math.max((cel.width + 8) / w, (cel.height + 8) / h);
        x.drawImage(img, (cel.width - w * skala) / 2, (cel.height - h * skala) / 2, w * skala, h * skala);
      }
      function ustawTlo(url) {
        if (url === tloUrl) return;
        tloUrl = url;
        var nast = tloAktywne === "a" ? "b" : "a";
        var cel = $("tlo-" + nast), stare = $("tlo-" + tloAktywne);
        if (!url) { stare.classList.remove("widoczna"); return; }
        var img = new Image();
        img.onload = function () {
          if (tloUrl !== url) return;
          malujTlo(cel, img);
          cel.classList.add("widoczna");
          stare.classList.remove("widoczna");
          tloAktywne = nast;
        };
        img.src = url;
      }

      // Kolor przewodni z okładki (gdy serwer obrazów pozwala czytać piksele)
      function kolorZOkladki(img) {
        try {
          var c = document.createElement("canvas");
          c.width = 24; c.height = 24;
          var x = c.getContext("2d");
          x.drawImage(img, 0, 0, 24, 24);
          var p = x.getImageData(0, 0, 24, 24).data, najl = null, wynik = 0;
          for (var i = 0; i < p.length; i += 4) {
            var r = p[i], g = p[i + 1], b = p[i + 2];
            var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
            var nas = mx === 0 ? 0 : (mx - mn) / mx, jas = mx / 255;
            var ocena = nas * 0.7 + jas * 0.3 - (jas < 0.25 ? 1 : 0);
            if (ocena > wynik) { wynik = ocena; najl = [r, g, b]; }
          }
          if (najl) {
            var k = Math.max.apply(null, najl), s = k < 200 ? 200 / Math.max(k, 1) : 1;
            document.documentElement.style.setProperty("--akcent",
              najl.map(function (v) { return Math.min(255, Math.round(v * s)); }).join(", "));
          }
        } catch (e) {
          document.documentElement.style.setProperty("--akcent", "255, 255, 255");
        }
      }
      $("okladka").addEventListener("load", function () { kolorZOkladki(this); });

      // Tłumaczenie komunikatów stanu ze skryptu Sendspin
      var STANY = [
        [/ready to play/i, "Gotowe do grania"],
        [/connecting/i, "Łączę z Music Assistant"],
        [/connected/i, "Połączono"],
        [/waiting/i, "Czekam na muzykę"],
        [/disconnected|connection lost/i, "Rozłączono, łączę ponownie"],
        [/error|failed/i, "Kłopot z połączeniem"]
      ];
      window.setStatus = function (tekst) {
        var t = String(tekst || "");
        for (var i = 0; i < STANY.length; i++) if (STANY[i][0].test(t)) { t = STANY[i][1]; break; }
        // Pod planszą tylko kłopoty z połączeniem; „gotowe” i „połączono” nic nie wnoszą
        $("stan").textContent = /Gotowe|Połączono|Czekam/.test(t) ? "" : t;
      };
      window.setDebug = function (tekst) { $("debug").textContent = tekst; };

      window.showError = function (kontekst, blad) {
        $("error-context").textContent = kontekst;
        $("error-message").textContent = blad instanceof Error ? blad.message : String(blad);
        $("error-stack").textContent = blad instanceof Error && blad.stack ? blad.stack : "";
        $("error-meta").textContent = new Date().toISOString() + "\n" + navigator.userAgent;
        $("error-overlay").classList.add("visible");
        console.error("Sendspin [" + kontekst + "]:", blad);
      };

      window.setPlaybackIcon = function () {};
      var ostatniStan = null, bezUtworu = false;
      window.setPlaybackState = function (gra) {
        if (ostatniStan === gra) return;
        ostatniStan = gra;
        body.classList.toggle("pauza", !gra);
        if (gra) bezUtworu = false;
        if (!body.classList.contains("cisza") && !bezUtworu) $("naglowek-tekst").textContent = gra ? "Teraz gra" : "Pauza";
      };

      var ostatnie = null;
      window.setNowPlaying = function (m) {
        if (!m) {
          // Plansza zostaje: ostatni utwór jak w pauzie (tło i okładka bez zmian)
          if (ostatnie === null) return;
          bezUtworu = true;
          body.classList.add("pauza");
          $("naglowek-tekst").textContent = "Ostatnio grało";
          $("postep").style.display = "none";
          ostatniStan = null;
          return;
        }
        var tytul = m.title || "-", wyk = m.artist || "", album = m.album || "", art = m.artworkUrl || null;
        var klucz = [tytul, wyk, album, art].join("\u0001");
        if (ostatnie === klucz) return;
        ostatnie = klucz;
        body.classList.remove("cisza");
        bezUtworu = false;
        $("naglowek-tekst").textContent = body.classList.contains("pauza") ? "Pauza" : "Teraz gra";
        $("tytul").textContent = tytul;
        $("wykonawca").textContent = wyk.replace(/\//g, ", ");
        $("album").textContent = album;
        if (art) {
          $("okladka").src = art;
          $("okladka").style.display = "block";
          $("okladka-pusta").style.display = "none";
        } else {
          $("okladka").style.display = "none";
          $("okladka-pusta").style.display = "flex";
          document.documentElement.style.setProperty("--akcent", "255, 255, 255");
        }
        ustawTlo(art);
      };

      function czas(s) {
        if (!s || s < 0) return "0:00";
        var m = Math.floor(s / 60), r = Math.floor(s % 60);
        return m + ":" + (r < 10 ? "0" : "") + r;
      }
      window.setProgress = function (biezacy, calkowity) {
        var radio = !calkowity || calkowity <= 0;
        $("postep").style.display = radio ? "none" : "block";
        if (radio) return;
        $("postep-wypelnienie").style.width = Math.min(100, (biezacy / calkowity) * 100) + "%";
        $("czas-biezacy").textContent = czas(biezacy);
        $("czas-calkowity").textContent = czas(calkowity);
      };

      window.setVolume = function (poziom, wyciszony) {
        var p = Math.round(poziom * 100);
        $("glosnosc-wypelnienie").style.width = (wyciszony ? 0 : p) + "%";
        $("glosnosc-procent").textContent = wyciszony ? "Wyciszone" : p + "%";
      };
    </script>
  </body>
</html>
